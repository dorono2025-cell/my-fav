<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To My Fav 💜</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
font-family:'Manrope',sans-serif;
color:white;
background:#0a0014;
}

/* Animated Gradient */
.bg{
position:fixed;
width:200%;
height:200%;
background:linear-gradient(135deg,#150028,#4b0082,#1b0033,#6a00b8);
background-size:400% 400%;
animation:gradientMove 20s ease infinite;
z-index:-5;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Stars */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2;}
to{opacity:1;}
}

/* Sparkle */
.sparkle{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:0.7;
animation:float linear infinite;
}

@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

/* Falling */
.fall{
position:absolute;
top:-10px;
animation:fall linear infinite;
}

@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);}
}

/* Screens */
.screen{
position:absolute;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{display:flex;}

/* Card */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(30px);
padding:70px;
border-radius:35px;
box-shadow:0 30px 80px rgba(0,0,0,0.5);
max-width:600px;
border:1px solid rgba(255,255,255,0.15);
}

/* Headings */
h1{
font-family:'DM Serif Display',serif;
font-size:3.4rem;
letter-spacing:1px;
}

.sub{
font-size:1.1rem;
margin-top:15px;
opacity:0.9;
line-height:1.7;
}

/* Input */
.input{
margin-top:35px;
padding:16px;
border-radius:50px;
border:1px solid rgba(255,255,255,0.5);
background:rgba(255,255,255,0.05);
color:white;
text-align:center;
width:280px;
outline:none;
}

/* Button */
.button{
margin-top:35px;
padding:15px 45px;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#ffffff,#e0c3fc);
color:black;
font-weight:600;
cursor:pointer;
}

/* Love Text */
.love{
font-family:'DM Serif Display',serif;
font-size:4.5rem;
background:linear-gradient(45deg,#ffffff,#e0c3fc,#c471f5);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

/* Fireworks */
.firework{
position:absolute;
width:15px;
height:15px;
border-radius:50%;
animation:explode 1.4s ease-out forwards;
}

@keyframes explode{
from{transform:scale(1);opacity:1;}
to{transform:scale(55);opacity:0;}
}

.error{margin-top:15px;color:#ffb3c1;}
</style>
</head>

<body>

<div class="bg"></div>

<!-- FIXED MUSIC -->
<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- SCREEN 1 -->
<div id="screen1" class="screen active">
<div class="card">
<h1>To My Fav 💜</h1>
<div class="sub">Private Luxury Access</div>

<input id="passcode" type="password" placeholder="Enter your name..." class="input">

<button onclick="checkCode()" class="button">
Enter ✨
</button>

<p id="error" class="error"></p>
</div>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen">
<div class="card">
<h1>Happy Valentine's Pravin 💎</h1>
<p class="sub">
Lowkey you’re my favorite person fr 🫶🏽 <br><br>
Thank you for the vibes, the random convos, the support,
and even those “si unitumie ka 100” moments 😂💸 <br><br>
Our friendship? <b>Premium. No subscription needed 😌✨</b>
</p>

<button onclick="nextScreen(3)" class="button">
One More Thing…
</button>
</div>
</div>

<!-- SCREEN 3 -->
<div id="screen3" class="screen">
<div class="card">
<div class="love">I LOVE YOU 💜</div>
<p class="sub">Forever my VIP human.</p>
<button onclick="fireworks()" class="button">
Celebrate 🎆
</button>
</div>
</div>

<script>

/* MUSIC FIX */
const music = document.getElementById("bgMusic");
document.body.addEventListener("click", function () {
    music.play().catch(()=>{});
}, { once: true });

/* Stars */
for(let i=0;i<80;i++){
let star=document.createElement("div");
star.className="star";
star.style.top=Math.random()*100+"vh";
star.style.left=Math.random()*100+"vw";
star.style.animationDelay=Math.random()*3+"s";
document.body.appendChild(star);
}

/* Sparkle */
setInterval(()=>{
let sparkle=document.createElement("div");
sparkle.className="sparkle";
sparkle.style.left=Math.random()*100+"vw";
sparkle.style.animationDuration=(Math.random()*6+6)+"s";
document.body.appendChild(sparkle);
setTimeout(()=>sparkle.remove(),10000);
},300);

/* Hearts + Roses */
setInterval(()=>{
let item=document.createElement("div");
item.className="fall";
item.innerHTML=Math.random()>0.5?"💜":"🌹";
item.style.left=Math.random()*100+"vw";
item.style.fontSize=(Math.random()*30+20)+"px";
item.style.animationDuration=(Math.random()*7+6)+"s";
document.body.appendChild(item);
setTimeout(()=>item.remove(),13000);
},600);

function checkCode(){
let code=document.getElementById("passcode").value.toLowerCase();
if(code==="pravin"){
nextScreen(2);
}else{
document.getElementById("error").innerHTML="Not very VIP 😌 try again.";
}
}

function nextScreen(num){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("screen"+num).classList.add("active");
}

function fireworks(){
let colors=["#ffffff","#ff4d6d","#c471f5","#e0c3fc","#ffd700"];
for(let i=0;i<60;i++){
let fire=document.createElement("div");
fire.className="firework";
fire.style.top=Math.random()*80+"vh";
fire.style.left=Math.random()*100+"vw";
fire.style.background=colors[Math.floor(Math.random()*colors.length)];
document.body.appendChild(fire);
setTimeout(()=>fire.remove(),1400);
}
}

</script>

</body>
</html>
